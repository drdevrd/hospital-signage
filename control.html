<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Display — Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: #0f1115; color: #e8e8e8;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    max-width: 640px; margin-left: auto; margin-right: auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #999; font-size: 13px; margin-bottom: 20px; }
  .card {
    background: #1a1d24; border-radius: 10px; padding: 14px; margin-bottom: 12px;
  }
  .upload-card { border: 1px dashed #3a3f4b; }
  label { font-size: 13px; color: #aaa; display: block; margin-bottom: 4px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #333;
    background: #0f1115; color: #eee; margin-bottom: 10px; font-size: 14px;
  }
  input[type=file] { color: #ccc; margin-bottom: 10px; }
  button {
    padding: 9px 14px; border-radius: 6px; border: none; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-danger { background: #ef444422; color: #ef4444; }
  .btn-play { background: #22c55e22; color: #22c55e; }
  .btn-ghost { background: #2a2e37; color: #ccc; }
  .item-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid #2a2e37;
  }
  .item-row:last-child { border-bottom: none; }
  .item-title { flex: 1; font-size: 14px; }
  .item-type { font-size: 11px; color: #888; text-transform: uppercase; }
  .row-actions { display: flex; gap: 6px; }
  .row-actions button { padding: 6px 9px; font-size: 12px; }
  #overrideBanner {
    display: none; background: #22c55e22; color: #22c55e; padding: 10px 14px;
    border-radius: 8px; margin-bottom: 14px; font-size: 14px; align-items: center;
    justify-content: space-between;
  }
  #msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .empty-state { color: #777; font-size: 14px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
  <h1>H.S. Hospital — TV Display Control</h1>
  <div class="sub">Add content, reorder the loop, or push something to play now.</div>

  <div id="overrideBanner">
    <span>Currently overriding: <strong id="overrideTitle"></strong></span>
    <button class="btn-ghost" onclick="clearOverride()">Resume Loop</button>
  </div>

  <div class="card upload-card">
    <label>Title</label>
    <input type="text" id="titleInput" placeholder="e.g. Hospital Introduction">
    <label>File (video or image)</label>
    <input type="file" id="fileInput" accept="video/*,image/*">
    <label id="durLabel" style="display:none">Show for how many seconds? (images only)</label>
    <input type="number" id="durInput" value="8" style="display:none">
    <button class="btn-primary" onclick="uploadItem()">Upload & Add to Playlist</button>
    <div id="msg"></div>
  </div>

  <div class="card">
    <div id="itemsList"><div class="empty-state">Loading…</div></div>
  </div>

<script>
const SUPABASE_URL = "https://ihbbihdjyphngxgoazxt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_i0L6b4_Xyf94lpzLXlEM6g_832eesuH";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const fileInput = document.getElementById('fileInput');
const durLabel = document.getElementById('durLabel');
const durInput = document.getElementById('durInput');
const msg = document.getElementById('msg');

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  const isImage = f && f.type.startsWith('image/');
  durLabel.style.display = isImage ? 'block' : 'none';
  durInput.style.display = isImage ? 'block' : 'none';
});

async function uploadItem() {
  const title = document.getElementById('titleInput').value.trim();
  const file = fileInput.files[0];
  if (!title || !file) { msg.textContent = 'Please add a title and choose a file.'; msg.style.color = '#ef4444'; return; }

  const mediaType = file.type.startsWith('video/') ? 'video' : 'image';
  const duration = parseInt(durInput.value) || 8;
  const path = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

  msg.textContent = 'Uploading…'; msg.style.color = '#999';
  const { error: upErr } = await supabase.storage.from('signage-media').upload(path, file);
  if (upErr) { msg.textContent = 'Upload failed: ' + upErr.message; msg.style.color = '#ef4444'; return; }

  const { data: urlData } = supabase.storage.from('signage-media').getPublicUrl(path);
  const { data: maxData } = await supabase.from('signage_items').select('order_index').order('order_index', { ascending: false }).limit(1);
  const nextOrder = (maxData && maxData.length) ? maxData[0].order_index + 1 : 0;

  const { error: insErr } = await supabase.from('signage_items').insert({
    title, media_type: mediaType, url: urlData.publicUrl,
    duration_seconds: duration, order_index: nextOrder, active: true
  });
  if (insErr) { msg.textContent = 'Save failed: ' + insErr.message; msg.style.color = '#ef4444'; return; }

  msg.textContent = 'Added!'; msg.style.color = '#22c55e';
  document.getElementById('titleInput').value = '';
  fileInput.value = '';
  durLabel.style.display = 'none'; durInput.style.display = 'none';
  loadItems();
}

async function loadItems() {
  const { data, error } = await supabase.from('signage_items').select('*').order('order_index', { ascending: true });
  const list = document.getElementById('itemsList');
  if (error) { list.innerHTML = '<div class="empty-state">Error loading items.</div>'; return; }
  if (!data.length) { list.innerHTML = '<div class="empty-state">No content yet — add something above.</div>'; return; }

  list.innerHTML = data.map((item, i) => `
    <div class="item-row">
      <div>
        <div class="item-title">${escapeHtml(item.title)}</div>
        <div class="item-type">${item.media_type}${item.media_type === 'image' ? ' · ' + item.duration_seconds + 's' : ''}</div>
      </div>
      <div class="row-actions">
        <button class="btn-ghost" onclick="moveItem('${item.id}', ${i}, -1)">↑</button>
        <button class="btn-ghost" onclick="moveItem('${item.id}', ${i}, 1)">↓</button>
        <button class="btn-play" onclick="playNow('${item.id}', '${escapeHtml(item.title)}')">Play Now</button>
        <button class="btn-danger" onclick="deleteItem('${item.id}')">Delete</button>
      </div>
    </div>
  `).join('');

  window._items = data;
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function moveItem(id, index, dir) {
  const items = window._items;
  const swapIndex = index + dir;
  if (swapIndex < 0 || swapIndex >= items.length) return;
  const a = items[index], b = items[swapIndex];
  await supabase.from('signage_items').update({ order_index: b.order_index }).eq('id', a.id);
  await supabase.from('signage_items').update({ order_index: a.order_index }).eq('id', b.id);
  loadItems();
}

async function deleteItem(id) {
  if (!confirm('Delete this item from the playlist?')) return;
  await supabase.from('signage_items').delete().eq('id', id);
  loadItems();
}

async function playNow(id, title) {
  await supabase.from('signage_state').update({ override_item_id: id, updated_at: new Date().toISOString() }).eq('id', 1);
  showOverrideBanner(title);
}

async function clearOverride() {
  await supabase.from('signage_state').update({ override_item_id: null }).eq('id', 1);
  document.getElementById('overrideBanner').style.display = 'none';
}

function showOverrideBanner(title) {
  document.getElementById('overrideTitle').textContent = title;
  document.getElementById('overrideBanner').style.display = 'flex';
}

async function checkCurrentOverride() {
  const { data } = await supabase.from('signage_state').select('override_item_id').eq('id', 1).single();
  if (data && data.override_item_id) {
    const item = (window._items || []).find(i => i.id === data.override_item_id);
    if (item) showOverrideBanner(item.title);
  } else {
    document.getElementById('overrideBanner').style.display = 'none';
  }
}

(async function init() {
  await loadItems();
  await checkCurrentOverride();
})();
</script>
</body>
</html>
