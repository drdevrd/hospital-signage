<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H.S. Hospital — TV Display</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  #stage { position: fixed; inset: 0; background: #000; }
  #stage video, #stage img {
    width: 100%; height: 100%; object-fit: contain;
    position: absolute; inset: 0;
  }
  #status {
    position: fixed; bottom: 12px; right: 16px;
    color: rgba(255,255,255,0.35); font-size: 14px; letter-spacing: 0.5px;
    z-index: 10;
  }
  #empty {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #666; font-size: 28px; text-align: center; padding: 0 40px;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="empty" style="display:none">No content added yet.<br>Open the control page to add videos or images.</div>
  <div id="status"></div>

<script>
const SUPABASE_URL = "https://ihbbihdjyphngxgoazxt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_i0L6b4_Xyf94lpzLXlEM6g_832eesuH";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const emptyEl = document.getElementById('empty');

let playlist = [];      // active items, ordered
let loopIndex = 0;      // position in the normal loop
let currentOverrideId = null;
let imageTimer = null;
let isPlayingOverride = false;

function setStatus(text) { statusEl.textContent = text; }

async function loadPlaylist() {
  const { data, error } = await supabase
    .from('signage_items')
    .select('*')
    .eq('active', true)
    .order('order_index', { ascending: true });
  if (error) { setStatus('Error loading playlist'); console.error(error); return; }
  playlist = data || [];
  emptyEl.style.display = playlist.length ? 'none' : 'flex';
  if (loopIndex >= playlist.length) loopIndex = 0;
}

function clearStage() {
  if (imageTimer) { clearTimeout(imageTimer); imageTimer = null; }
  stage.innerHTML = '';
}

function playItem(item, onDone) {
  clearStage();
  if (!item) { onDone && onDone(); return; }
  setStatus(item.title || '');

  if (item.media_type === 'video') {
    const v = document.createElement('video');
    v.src = item.url;
    v.autoplay = true;
    v.muted = false;
    v.playsInline = true;
    v.onended = () => onDone && onDone();
    v.onerror = () => onDone && onDone();
    stage.appendChild(v);
    v.play().catch(() => { /* autoplay w/ sound may be blocked; try muted */
      v.muted = true; v.play().catch(()=>{});
    });
  } else {
    const img = document.createElement('img');
    img.src = item.url;
    stage.appendChild(img);
    const secs = item.duration_seconds || 8;
    imageTimer = setTimeout(() => onDone && onDone(), secs * 1000);
  }
}

function playNextInLoop() {
  if (isPlayingOverride) return; // don't advance loop while override is active
  if (!playlist.length) { emptyEl.style.display = 'flex'; setTimeout(playNextInLoop, 5000); return; }
  const item = playlist[loopIndex % playlist.length];
  loopIndex = (loopIndex + 1) % playlist.length;
  playItem(item, playNextInLoop);
}

async function checkOverride() {
  const { data, error } = await supabase
    .from('signage_state')
    .select('override_item_id')
    .eq('id', 1)
    .single();
  if (error) return;
  const overrideId = data.override_item_id;
  if (overrideId && overrideId !== currentOverrideId) {
    currentOverrideId = overrideId;
    const item = playlist.find(p => p.id === overrideId);
    if (item) {
      isPlayingOverride = true;
      playItem(item, async () => {
        isPlayingOverride = false;
        // clear the override in the DB so it doesn't replay
        await supabase.from('signage_state').update({ override_item_id: null }).eq('id', 1);
        currentOverrideId = null;
        playNextInLoop();
      });
    }
  } else if (!overrideId) {
    currentOverrideId = null;
  }
}

// Realtime subscription (primary trigger)
supabase
  .channel('signage_state_changes')
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'signage_state' }, () => {
    checkOverride();
  })
  .subscribe();

// Fallback poll every 15s in case realtime drops on the TV browser
setInterval(checkOverride, 15000);
// Refresh playlist periodically so new uploads show up without restarting the TV
setInterval(loadPlaylist, 60000);

(async function start() {
  await loadPlaylist();
  playNextInLoop();
})();

// Try to enter fullscreen on first tap (some TV browsers require a gesture)
document.body.addEventListener('click', () => {
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}, { once: true });
</script>
</body>
</html>
